name: Publish Python SDK to PyPI

# Publishes python/ to PyPI when you cut a GitHub Release.
# Uses Trusted Publishing (OIDC) — no API token stored. One-time setup:
# PyPI → your project → Publishing → add a GitHub publisher for this repo,
# workflow "publish-python.yml", environment "pypi".

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist + wheel
        run: |
          cd python
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
